[package]
name = "filmcraft-android"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]
name = "filmcraft_android"

[package.metadata.android]
package = "com.artcraft.filmcraft"
apk_name = "FilmCraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["wgpu", "android-game-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
android_logger = "0.14"
log = { workspace = true }
