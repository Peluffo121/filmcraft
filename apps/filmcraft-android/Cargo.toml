[package]
name = "filmcraft-android"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]
name = "filmcraft_android"

[package.metadata.android]
package = "com.artcraft.filmcraft"
apk_name = "FilmCraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[dependencies]
filmcraft-engine = { path = "../../crates/engine" }
filmcraft-ui-egui = { path = "../../crates/ui-egui" }
eframe = { version = "0.30", default-features = false, features = ["wgpu", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"
log = "0.4"
